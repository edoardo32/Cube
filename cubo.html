<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cubo di Rubik 3D</title>

<!-- Font: Outfit (interfaccia) + JetBrains Mono (mosse) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  /* =====================================================================
   *  TEMI: scuro (default) e chiaro, gestiti con variabili CSS
   * ===================================================================== */
  :root, [data-theme="dark"] {
    --bg: #0b0d12;
    --glow-1: #1b2030;
    --glow-2: #1a1530;
    --panel: rgba(20, 23, 31, 0.72);
    --border: rgba(255, 255, 255, 0.09);
    --text: #eef0f6;
    --chip-bg: rgba(255, 255, 255, 0.06);
    --chip-text: #d5d9e6;
    --chip-last-bg: rgba(110, 168, 255, 0.18);
    --chip-last-border: rgba(110, 168, 255, 0.55);
    --chip-last-text: #ffffff;
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    --font-ui: "Outfit", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="light"] {
    --bg: #e9ecf3;
    --glow-1: #ffffff;
    --glow-2: #dfe4f2;
    --panel: rgba(255, 255, 255, 0.75);
    --border: rgba(20, 24, 40, 0.10);
    --text: #1a1d29;
    --chip-bg: rgba(20, 24, 40, 0.05);
    --chip-text: #2a2f42;
    --chip-last-bg: rgba(60, 120, 240, 0.14);
    --chip-last-border: rgba(60, 120, 240, 0.5);
    --chip-last-text: #14306b;
    --shadow: 0 10px 32px rgba(40, 50, 90, 0.16);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 50% at 50% 45%, var(--glow-1) 0%, transparent 70%),
      radial-gradient(ellipse at 50% 120%, var(--glow-2) 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; position: fixed; inset: 0; z-index: 0; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }

  /* ---------- Pannello in vetro ---------- */
  .panel {
    position: fixed;
    z-index: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: var(--shadow);
    transition: background .25s, border-color .25s, opacity .25s;
  }

  /* ---------- Interruttore tema (alto a destra) ---------- */
  #theme-toggle {
    top: 18px; right: 18px; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer; padding: 0;
    color: var(--text);
  }
  #theme-toggle:hover { transform: scale(1.06); }
  #theme-toggle:active { transform: scale(.95); }
  #theme-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Nel tema scuro mostra il sole (per passare al chiaro), nel chiaro la luna */
  #theme-toggle .moon { display: none; }
  [data-theme="light"] #theme-toggle .sun { display: none; }
  [data-theme="light"] #theme-toggle .moon { display: block; }

  /* ---------- Cronologia mosse (in basso al centro) ---------- */
  #history {
    bottom: 20px; left: 50%; transform: translateX(-50%);
    border-radius: 18px; padding: 12px 16px; width: max-content; max-width: min(92vw, 720px);
  }
  #history.empty { opacity: 0; pointer-events: none; }
  #moves { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; }
  .chip {
    font: 700 14px var(--font-mono); padding: 4px 10px; border-radius: 8px;
    background: var(--chip-bg); border: 1px solid var(--border); color: var(--chip-text);
  }
  .chip.last { background: var(--chip-last-bg); border-color: var(--chip-last-border); color: var(--chip-last-text); }
  .chip.more { background: none; border: none; padding: 4px 2px; opacity: .6; }

  #error { display: none; position: fixed; inset: 0; z-index: 2; align-items: center; justify-content: center; text-align: center; padding: 30px; color: #ff8a8a; }
</style>
</head>
<body>

<!-- ===== Interruttore tema chiaro / scuro ===== -->
<button id="theme-toggle" class="panel" aria-label="Passa al tema chiaro">
  <!-- Sole -->
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <!-- Luna -->
  <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>

<!-- ===== Cronologia mosse ===== -->
<div id="history" class="panel empty"><div id="moves"></div></div>

<div id="error">Impossibile caricare Three.js. Controlla la connessione a internet e ricarica la pagina.</div>

<!-- Libreria Three.js da CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  if (typeof THREE === 'undefined') {
    document.getElementById('error').style.display = 'flex';
    return;
  }

  /* =====================================================================
   *  0. TEMA CHIARO / SCURO
   * ===================================================================== */

  const root = document.documentElement;

  // Recupera il tema salvato (se il browser lo consente)
  try {
    const saved = localStorage.getItem('rubik-theme');
    if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
  } catch (e) { /* storage non disponibile: si usa il tema di default */ }

  const themeToggle = document.getElementById('theme-toggle');
  const updateThemeToggleLabel = () => {
    themeToggle.setAttribute('aria-label', root.dataset.theme === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro');
  };
  updateThemeToggleLabel();

  themeToggle.addEventListener('click', () => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    updateThemeToggleLabel();
    try { localStorage.setItem('rubik-theme', next); } catch (e) {}
  });
  // Il pulsante non deve rubare il focus alla tastiera (es. barra spaziatrice)
  document.getElementById('theme-toggle').addEventListener('mousedown', e => e.preventDefault());

  /* =====================================================================
   *  1. CONFIGURAZIONE
   * ===================================================================== */

  // Colori classici del cubo:
  //   +x = R (Rosso)   -x = L (Arancione)
  //   +y = U (Bianco)  -y = D (Giallo)
  //   +z = F (Verde)   -z = B (Blu)
  const COLORS = {
    U: 0xffffff, D: 0xffd500, F: 0x009b48,
    B: 0x0046ad, R: 0xb71234, L: 0xff5800
  };

  // Ogni faccia: asse, strato (+1/-1) e verso della rotazione ORARIA
  // (guardando la faccia dall'esterno), come segno dell'angolo di 90°.
  const FACES = {
    U: { axis: 'y', layer:  1, dir: -1, normal: new THREE.Vector3( 0,  1,  0) },
    D: { axis: 'y', layer: -1, dir:  1, normal: new THREE.Vector3( 0, -1,  0) },
    R: { axis: 'x', layer:  1, dir: -1, normal: new THREE.Vector3( 1,  0,  0) },
    L: { axis: 'x', layer: -1, dir:  1, normal: new THREE.Vector3(-1,  0,  0) },
    F: { axis: 'z', layer:  1, dir: -1, normal: new THREE.Vector3( 0,  0,  1) },
    B: { axis: 'z', layer: -1, dir:  1, normal: new THREE.Vector3( 0,  0, -1) }
  };
  const FACE_KEYS = Object.keys(FACES);

  const MOVE_DURATION     = 250; // ms, rotazione normale
  const SCRAMBLE_DURATION = 120; // ms, rotazione durante il mescolamento
  const SCRAMBLE_LENGTH   = 20;  // mosse del mescolamento
  const MAX_QUEUE         = 60;  // massimo di mosse in coda
  const HISTORY_VISIBLE   = 24;  // mosse mostrate nel pannello

  const ISO_VIEW = { theta: 0.75, phi: 1.12 };
  const PHI_MIN = 0.12, PHI_MAX = Math.PI - 0.12;
  const ZOOM_MIN = 0.55, ZOOM_MAX = 1.7;

  /* =====================================================================
   *  2. SCENA, CAMERA, RENDERER, LUCI
   * ===================================================================== */

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0); // sfondo trasparente: si vede lo sfondo CSS (chiaro o scuro)
  document.body.appendChild(renderer.domElement);
  const canvas = renderer.domElement;

  // Illuminazione: ambiente + luce principale + luce da dietro (per vedere bene tutte le facce)
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.6);
  keyLight.position.set(5, 8, 6);
  scene.add(keyLight);
  const backLight = new THREE.DirectionalLight(0xbcd0ff, 0.45);
  backLight.position.set(-6, -4, -7);
  scene.add(backLight);

  /* =====================================================================
   *  3. CAMERA ORBITALE (mouse, touch, frecce)
   * ===================================================================== */

  const orbit = {
    theta: ISO_VIEW.theta, phi: ISO_VIEW.phi,
    targetTheta: ISO_VIEW.theta, targetPhi: ISO_VIEW.phi,
    zoom: 1, targetZoom: 1,
    baseRadius: 9.5
  };

  function updateCamera() {
    // Interpolazione morbida verso i valori obiettivo
    orbit.theta += (orbit.targetTheta - orbit.theta) * 0.16;
    orbit.phi   += (orbit.targetPhi   - orbit.phi)   * 0.16;
    orbit.zoom  += (orbit.targetZoom  - orbit.zoom)  * 0.16;

    const r = orbit.baseRadius * orbit.zoom;
    camera.position.set(
      r * Math.sin(orbit.phi) * Math.sin(orbit.theta),
      r * Math.cos(orbit.phi),
      r * Math.sin(orbit.phi) * Math.cos(orbit.theta)
    );
    camera.lookAt(0, 0, 0);
  }

  /** Torna alla vista iniziale scegliendo il percorso angolare più breve. */
  function resetView() {
    const TWO_PI = Math.PI * 2;
    orbit.targetTheta = ISO_VIEW.theta + TWO_PI * Math.round((orbit.targetTheta - ISO_VIEW.theta) / TWO_PI);
    orbit.targetPhi = ISO_VIEW.phi;
    orbit.targetZoom = 1;
  }

  const clampPhi  = () => { orbit.targetPhi  = Math.max(PHI_MIN,  Math.min(PHI_MAX,  orbit.targetPhi));  };
  const clampZoom = () => { orbit.targetZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, orbit.targetZoom)); };

  /* ---- Trascinamento con mouse / touch (Pointer Events) ---- */
  const pointers = new Map();   // pointerId -> {x, y}
  let pinchStartDist = 0, pinchStartZoom = 1;

  const pointerDistance = () => {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.classList.add('dragging');
    if (pointers.size === 2) {
      pinchStartDist = pointerDistance();
      pinchStartZoom = orbit.targetZoom;
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size === 1) {
      // Un dito / mouse: ruota l'inquadratura attorno al cubo
      orbit.targetTheta -= dx * 0.008;
      orbit.targetPhi   -= dy * 0.008;
      clampPhi();
    } else if (pointers.size === 2 && pinchStartDist > 0) {
      // Due dita: pizzico per lo zoom
      orbit.targetZoom = pinchStartZoom * (pinchStartDist / pointerDistance());
      clampZoom();
    }
  });

  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // Rotellina: zoom
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    orbit.targetZoom *= Math.exp(e.deltaY * 0.001);
    clampZoom();
  }, { passive: false });

  // Doppio click: vista iniziale
  canvas.addEventListener('dblclick', resetView);

  /* =====================================================================
   *  4. COSTRUZIONE DEL CUBO (27 cubini)
   * ===================================================================== */

  const cubeGroup = new THREE.Group();
  scene.add(cubeGroup);

  const pivot = new THREE.Object3D();    // perno temporaneo per ruotare uno strato
  cubeGroup.add(pivot);

  let cubies = [];

  const bodyGeometry = new THREE.BoxGeometry(1, 1, 1);
  const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.6, metalness: 0.1 });

  // Adesivo a quadrato con angoli arrotondati
  function roundedSquare(size, r) {
    const s = size / 2, sh = new THREE.Shape();
    sh.moveTo(-s + r, -s);
    sh.lineTo(s - r, -s);  sh.quadraticCurveTo(s, -s, s, -s + r);
    sh.lineTo(s, s - r);   sh.quadraticCurveTo(s, s, s - r, s);
    sh.lineTo(-s + r, s);  sh.quadraticCurveTo(-s, s, -s, s - r);
    sh.lineTo(-s, -s + r); sh.quadraticCurveTo(-s, -s, -s + r, -s);
    return new THREE.ShapeGeometry(sh);
  }
  const stickerGeometry = roundedSquare(0.86, 0.12); // più piccolo del cubino: lascia il bordo nero

  const stickerMaterials = {};
  for (const f of FACE_KEYS) {
    stickerMaterials[f] = new THREE.MeshStandardMaterial({ color: COLORS[f], roughness: 0.35, metalness: 0.0 });
  }

  const Z_AXIS = new THREE.Vector3(0, 0, 1);

  /** Crea un cubino alla posizione (x, y, z), con valori in {-1, 0, 1}. */
  function createCubie(x, y, z) {
    const cubie = new THREE.Mesh(bodyGeometry, bodyMaterial);
    cubie.position.set(x, y, z);

    // Adesivi solo sulle facce rivolte verso l'esterno
    for (const f of FACE_KEYS) {
      const n = FACES[f].normal;
      if (n.x * x + n.y * y + n.z * z === 1) {
        const sticker = new THREE.Mesh(stickerGeometry, stickerMaterials[f]);
        sticker.position.copy(n).multiplyScalar(0.502);
        sticker.quaternion.setFromUnitVectors(Z_AXIS, n);
        cubie.add(sticker);
      }
    }
    return cubie;
  }

  /** (Ri)costruisce il cubo risolto. */
  function buildCube() {
    for (const c of cubies) if (c.parent) c.parent.remove(c);
    cubies = [];
    pivot.rotation.set(0, 0, 0);

    for (let x = -1; x <= 1; x++)
      for (let y = -1; y <= 1; y++)
        for (let z = -1; z <= 1; z++) {
          const c = createCubie(x, y, z);
          cubies.push(c);
          cubeGroup.add(c);
        }
  }

  /* =====================================================================
   *  5. MOTORE DELLE MOSSE (coda + animazione)
   * ===================================================================== */

  const queue = [];
  let current = null;
  let history = [];

  const easeInOutCubic = t => (t < 0.5) ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function enqueueMove(face, prime, duration) {
    if (queue.length >= MAX_QUEUE) return;
    queue.push({ face, prime, duration: duration || MOVE_DURATION });
  }

  /** Avvia la prossima mossa in coda, se non ce n'è una in corso. */
  function startNextMove() {
    if (current || queue.length === 0) return;

    const move = queue.shift();
    const def = FACES[move.face];

    // Cubini dello strato da ruotare (in base alla posizione attuale)
    const layerCubies = cubies.filter(c => Math.round(c.position[def.axis]) === def.layer);

    // Li aggancia al perno: ruotando il perno ruota tutto lo strato
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld(true);
    layerCubies.forEach(c => pivot.attach(c));

    current = {
      move,
      axis: def.axis,
      target: def.dir * (move.prime ? -1 : 1) * Math.PI / 2,
      start: performance.now(),
      duration: move.duration,
      cubies: layerCubies
    };
  }

  /** Arrotonda posizione e orientamento per eliminare errori numerici. */
  function snapCubie(c) {
    c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
    const m = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
    m.elements = m.elements.map(v => Math.round(v));
    c.quaternion.setFromRotationMatrix(m);
  }

  /** Conclude la mossa: stacca i cubini dal perno e registra la mossa. */
  function finishMove() {
    pivot.rotation[current.axis] = current.target;
    pivot.updateMatrixWorld(true);

    current.cubies.forEach(c => {
      cubeGroup.attach(c);
      snapCubie(c);
    });
    pivot.rotation.set(0, 0, 0);

    history.push(current.move.face + (current.move.prime ? "'" : ''));
    current = null;
    renderHistory();
  }

  function updateAnimation() {
    if (!current) startNextMove();
    if (!current) return;

    const t = Math.min(1, (performance.now() - current.start) / current.duration);
    pivot.rotation[current.axis] = current.target * easeInOutCubic(t);
    if (t >= 1) finishMove();
  }

  /** Accoda 20 mosse casuali valide. */
  function scramble() {
    if (current || queue.length > 0) return;
    history = [];

    let lastFace = null;
    for (let i = 0; i < SCRAMBLE_LENGTH; i++) {
      // Niente due mosse consecutive sulla stessa faccia
      let face;
      do { face = FACE_KEYS[Math.floor(Math.random() * FACE_KEYS.length)]; } while (face === lastFace);
      lastFace = face;
      enqueueMove(face, Math.random() < 0.5, SCRAMBLE_DURATION);
    }
    renderHistory();
  }

  /** Riporta il cubo allo stato risolto. */
  function resetCube() {
    queue.length = 0;
    current = null;
    history = [];
    buildCube();
    renderHistory();
  }

  /* =====================================================================
   *  6. CRONOLOGIA MOSSE
   * ===================================================================== */

  const historyEl = document.getElementById('history');
  const movesEl   = document.getElementById('moves');

  function renderHistory() {
    movesEl.innerHTML = '';
    historyEl.classList.toggle('empty', history.length === 0);
    if (history.length === 0) return;

    if (history.length > HISTORY_VISIBLE) {
      const more = document.createElement('span');
      more.className = 'chip more';
      more.textContent = '…';
      movesEl.appendChild(more);
    }
    const visible = history.slice(-HISTORY_VISIBLE);
    visible.forEach((m, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (i === visible.length - 1 ? ' last' : '');
      chip.textContent = m;
      movesEl.appendChild(chip);
    });
  }

  /* =====================================================================
   *  7. CONTROLLI DA TASTIERA
   * ===================================================================== */

  const heldKeys = new Set();

  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const code = e.code;

    // Frecce: orbita della camera
    if (code.startsWith('Arrow')) {
      e.preventDefault();
      heldKeys.add(code);
      return;
    }
    // Spazio: mescola
    if (code === 'Space') {
      e.preventDefault();
      if (!e.repeat) scramble();
      return;
    }
    // Backspace / Esc: reset
    if (code === 'Backspace' || code === 'Escape') {
      e.preventDefault();
      resetCube();
      return;
    }
    // Lettere delle facce (Shift = antiorario)
    if (code.startsWith('Key')) {
      const face = code.slice(3);
      if (FACES[face]) {
        e.preventDefault();
        if (e.repeat) return;
        enqueueMove(face, e.shiftKey);
      }
    }
  });

  window.addEventListener('keyup', (e) => heldKeys.delete(e.code));
  window.addEventListener('blur', () => heldKeys.clear());

  /** Movimento della camera in base alle frecce premute. */
  function applyArrowInput(dt) {
    const speed = 1.8; // rad/s
    if (heldKeys.has('ArrowLeft'))  orbit.targetTheta -= speed * dt;
    if (heldKeys.has('ArrowRight')) orbit.targetTheta += speed * dt;
    if (heldKeys.has('ArrowUp'))    orbit.targetPhi    -= speed * dt;
    if (heldKeys.has('ArrowDown'))  orbit.targetPhi    += speed * dt;
    clampPhi();
  }

  /* =====================================================================
   *  8. RIDIMENSIONAMENTO E CICLO DI RENDERING
   * ===================================================================== */

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    // Su schermi stretti allontana la camera per tenere il cubo intero
    orbit.baseRadius = camera.aspect < 1 ? 9.5 / Math.max(0.55, camera.aspect) : 9.5;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  window.dispatchEvent(new Event('resize'));

  let lastTime = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    applyArrowInput(dt);
    updateCamera();
    updateAnimation();
    renderer.render(scene, camera);
  }

  /* =====================================================================
   *  9. AVVIO
   * ===================================================================== */

  buildCube();
  renderHistory();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
